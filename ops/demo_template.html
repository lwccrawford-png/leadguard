<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>__BUSINESS_NAME__ — Live Assistant Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<style>
  html, body { margin: 0; padding: 0; }
  .site-bg {
    background-image: url("__IMAGE_DATA_URI__");
    background-size: 100% auto;
    background-repeat: no-repeat;
    background-position: top center;
    background-color: #fff;
    min-height: 1420px;
    width: 100%;
  }
  .demo-banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2147483001;
    background: #111; color: #fff; font-family: -apple-system, sans-serif;
    text-align: center; padding: 8px 12px;
  }
  .demo-banner .headline { font-size: 13px; }
  .demo-banner .headline strong { color: #86efac; }
  .demo-banner .disclosure { font-size: 11px; color: #b7b7b7; margin-top: 3px; }
  .suggested-questions {
    position: fixed; right: 20px; bottom: 90px; z-index: 2147483000;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    max-width: 280px;
  }
  .suggested-questions button {
    font-family: -apple-system, sans-serif; font-size: 13px; text-align: left;
    background: #fff; border: 1px solid #ddd; border-radius: 14px;
    padding: 9px 14px; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.12);
    transition: transform .1s ease, border-color .1s ease;
  }
  .suggested-questions button:hover { border-color: __ACCENT_COLOR__; transform: translateY(-1px); }
  .prospect-video-card {
    position: fixed; left: 20px; top: 78px; z-index: 2147483000;
    width: 300px; background: #fff; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18);
    font-family: -apple-system, sans-serif; overflow: hidden;
  }
  .prospect-video-card .pv-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; font-size: 12px; font-weight: 600; color: #333;
  }
  .prospect-video-card .pv-close {
    border: none; background: none; cursor: pointer; font-size: 15px; line-height: 1; color: #999; padding: 2px 4px;
  }
  .prospect-video-card video { display: block; width: 100%; max-height: 220px; background: #000; }
  .booking-cta-wrap { position: fixed; left: 20px; bottom: 20px; z-index: 2147483000; }
  .booking-cta-wrap a {
    display: inline-block; font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 700;
    color: #fff; background: __ACCENT_COLOR__; border-radius: 20px; padding: 11px 18px;
    text-decoration: none; box-shadow: 0 2px 10px rgba(0,0,0,.18);
  }
</style>
</head>
<body>
  <div class="demo-banner">
    <div class="headline">Demo — this is <strong>__BUSINESS_NAME__'s actual homepage</strong>, with a live AI assistant already working on it. Click the bubble, bottom right.</div>
    <div class="disclosure">__DISCLOSURE__</div>
  </div>
  <div class="site-bg"></div>

  <div class="suggested-questions" id="suggestedQuestions"></div>

  <div class="prospect-video-card" id="prospectVideoCard" style="display:none;">
    <div class="pv-head"><span>A quick message for you</span><button type="button" class="pv-close" id="prospectVideoClose" aria-label="Close">&times;</button></div>
    <video id="prospectVideo" controls playsinline></video>
  </div>
  <div class="booking-cta-wrap" id="bookingCtaWrap" style="display:none;">
    <a id="bookingCtaLink" href="#" target="_blank" rel="noopener">📅 Book a call</a>
  </div>

  <script
    src="__API_BASE__/widget/widget.js"
    data-api-base="__API_BASE__"
    data-business-name="__BUSINESS_NAME__"
    data-color="__ACCENT_COLOR__"
    data-greeting="__GREETING__"
    defer
  ></script>
  <script>
    (function () {
      // Own session id for engagement tracking, independent of widget.js's internal
      // ai_frontdesk_session_id — avoids a load-order race (this script isn't deferred,
      // widget.js is) and keeps the tracking layer decoupled from the widget's internals.
      var SESSION_KEY = 'eiq_demo_session_id';
      var sessionId = localStorage.getItem(SESSION_KEY);
      if (!sessionId) {
        sessionId = 'demo_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        try { localStorage.setItem(SESSION_KEY, sessionId); } catch (e) {}
      }

      function trackEvent(eventType, metadata) {
        fetch('__API_BASE__/api/demo/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ event_type: eventType, session_id: sessionId, metadata: metadata || {} }),
        }).catch(function () {});
      }

      trackEvent('demo_page_opened');

      var QUESTIONS = __SUGGESTED_QUESTIONS_JSON__;
      // Opt-in only (?record=1), never present in a link sent to a real visitor — lets
      // whoever's driving a screen recording fire a scripted question with a keystroke
      // instead of clicking a visible "canned chatbot" bubble on camera. See below.
      var RECORD_MODE = /[?&]record=1(&|$)/.test(window.location.search);

      var container = document.getElementById('suggestedQuestions');
      if (!RECORD_MODE && QUESTIONS.length && container) {
        QUESTIONS.slice(0, 3).forEach(function (q) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = q;
          btn.addEventListener('click', function () {
            trackEvent('suggested_question_clicked', { question: q });
            askWidget(q);
          });
          container.appendChild(btn);
        });
      }

      function askWidget(question) {
        var host = document.getElementById('ai-frontdesk-widget-host');
        if (!host || !host.shadowRoot) {
          // widget.js is deferred and may not have run yet on a very fast click
          setTimeout(function () { askWidget(question); }, 150);
          return;
        }
        var root = host.shadowRoot;
        var panel = root.querySelector('.panel');
        if (panel && !panel.classList.contains('open')) {
          root.querySelector('.bubble').click();
        }
        var input = root.querySelector('.inputRow input');
        var sendBtn = root.querySelector('.inputRow button');
        if (!input || !sendBtn) return;
        input.value = question;
        // Setting .value directly doesn't fire a native 'input' event, but the send-tracking
        // listener below relies on exactly that to know what's about to be sent — dispatch one
        // explicitly so the suggested-question path is tracked the same as free-typed messages.
        input.dispatchEvent(new Event('input', { bubbles: true }));
        sendBtn.click();
        if (container) container.style.display = 'none';
      }

      // Recording-mode only: same end result as askWidget (opens the panel, sends the
      // question), but visibly types it into the real input character-by-character first —
      // on camera this is indistinguishable from a person typing, with no bubble UI ever
      // rendered to give away that it's scripted. Triggered by Option+1/2/3 on Mac /
      // Alt+1/2/3 on Windows — both fire the same KeyboardEvent.altKey (mapped to
      // QUESTIONS[0..2]), never by a click, so there's nothing on screen to give it away.
      var typingInProgress = false;
      function typeAndSendWidget(question) {
        if (typingInProgress) return;
        var host = document.getElementById('ai-frontdesk-widget-host');
        if (!host || !host.shadowRoot) {
          setTimeout(function () { typeAndSendWidget(question); }, 150);
          return;
        }
        var root = host.shadowRoot;
        var panel = root.querySelector('.panel');
        if (panel && !panel.classList.contains('open')) {
          root.querySelector('.bubble').click();
        }
        var input = root.querySelector('.inputRow input');
        var sendBtn = root.querySelector('.inputRow button');
        if (!input || !sendBtn) return;
        typingInProgress = true;
        input.focus();
        input.value = '';
        var i = 0;
        (function typeChar() {
          if (i < question.length) {
            input.value += question.charAt(i);
            input.dispatchEvent(new Event('input', { bubbles: true }));
            i++;
            setTimeout(typeChar, 28 + Math.random() * 45);
          } else {
            setTimeout(function () {
              sendBtn.click();
              typingInProgress = false;
            }, 450);
          }
        })();
      }

      if (RECORD_MODE) {
        document.addEventListener('keydown', function (e) {
          if (!e.altKey) return;
          // e.code (physical key) not e.key (character produced) — on Mac, Option+1/2/3
          // don't type "1"/"2"/"3" at all, they type "¡"/"™"/"£" (macOS's built-in Option-key
          // symbol map), so e.key would never match here. e.code stays "Digit1" etc.
          // regardless of modifiers or keyboard layout, on both Mac and PC.
          var idx = { 'Digit1': 0, 'Digit2': 1, 'Digit3': 2 }[e.code];
          if (idx === undefined || !QUESTIONS[idx]) return;
          e.preventDefault();
          trackEvent('suggested_question_clicked', { question: QUESTIONS[idx], via: 'record_mode_hotkey' });
          typeAndSendWidget(QUESTIONS[idx]);
        });
      }

      // Fires for every send — whether from a suggested-question chip (programmatic click,
      // still a real DOM click event) or the visitor typing their own message and hitting
      // Send/Enter. First send in this browser session also counts as conversation_started.
      var hasStartedConversation = false;
      function onSend() {
        if (!hasStartedConversation) {
          hasStartedConversation = true;
          trackEvent('conversation_started');
        }
        trackEvent('message_sent');
      }

      function attachSendTracking() {
        var host = document.getElementById('ai-frontdesk-widget-host');
        if (!host || !host.shadowRoot) {
          setTimeout(attachSendTracking, 200);
          return;
        }
        var root = host.shadowRoot;
        var input = root.querySelector('.inputRow input');
        var sendBtn = root.querySelector('.inputRow button');
        if (!input || !sendBtn) return;
        // widget.js's own send handler (attached at widget init, before this polling loop
        // ever finds the shadow root) clears input.value synchronously as soon as it fires —
        // since same-event listeners run in attachment order, reading input.value inside a
        // click/keydown handler attached here would see the empty post-clear value, not what
        // was actually sent. Track the live value on every keystroke instead, and read that.
        var liveValue = '';
        input.addEventListener('input', function () { liveValue = input.value; });
        sendBtn.addEventListener('click', function () {
          if (liveValue.trim()) onSend();
        });
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && liveValue.trim()) onSend();
        });
      }
      attachSendTracking();

      fetch('__API_BASE__/api/demo/config')
        .then(function (r) { return r.json(); })
        .then(function (config) {
          if (config.has_video) {
            var card = document.getElementById('prospectVideoCard');
            var video = document.getElementById('prospectVideo');
            video.src = '__API_BASE__/demo/video';
            card.style.display = 'block';
            document.getElementById('prospectVideoClose').addEventListener('click', function () {
              card.style.display = 'none';
            });
            var startedTracked = false;
            var progressMarks = { 25: false, 50: false, 75: false };
            video.addEventListener('play', function () {
              if (!startedTracked) { startedTracked = true; trackEvent('video_started'); }
            });
            video.addEventListener('timeupdate', function () {
              if (!video.duration) return;
              var pct = (video.currentTime / video.duration) * 100;
              [25, 50, 75].forEach(function (mark) {
                if (pct >= mark && !progressMarks[mark]) {
                  progressMarks[mark] = true;
                  trackEvent('video_' + mark);
                }
              });
            });
            video.addEventListener('ended', function () { trackEvent('video_completed'); });
          }
          if (config.booking_link) {
            var wrap = document.getElementById('bookingCtaWrap');
            var link = document.getElementById('bookingCtaLink');
            link.href = config.booking_link;
            wrap.style.display = 'block';
            link.addEventListener('click', function () {
              trackEvent('lead_cta_clicked', { type: 'booking_link' });
            });
          }
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
